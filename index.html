<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f060c">
<title>Uncanny Kin — Bestiário de Westfilds</title>
<style>
:root {
  --bg:#0f060c; --panel:#180c13; --panel2:#200f18; --line:#6d3253;
  --line-soft:#452035; --accent:#bc4d8c; --accent2:#78385d;
  --text:#deced7; --muted:#b29ea9; --gold:#e9b85b;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; padding:24px 16px 40px;
  color:var(--text); background:
    radial-gradient(ellipse at 50% 0%, #331426 0%, transparent 42%),
    repeating-linear-gradient(45deg, rgba(125,50,93,.035) 0 2px, transparent 2px 6px),
    var(--bg);
  font-family:Georgia, "Times New Roman", serif;
}
button { font:inherit; }
.page {
  width:min(1120px,100%); margin:0 auto; position:relative;
  border:1px solid var(--line); padding:18px;
  background:rgba(11,5,8,.82);
  box-shadow:0 0 0 5px rgba(93,36,68,.18), 0 0 38px rgba(120,39,85,.16);
}
.page:before,.page:after {
  content:"👁"; position:absolute; color:#954773; font-size:25px; top:8px;
}
.page:before {left:12px} .page:after {right:12px}
.brand {text-align:center; padding:4px 10px 18px; border-bottom:1px solid var(--line-soft);}
.brand-name {
  margin:0; font-size:clamp(32px,6vw,58px); line-height:1.05;
  letter-spacing:2px; color:#e6d4de; text-shadow:0 2px #6d3253, 0 0 18px #944572;
}
.brand-sub {
  margin:8px 0 0; color:#c19db1; font-size:clamp(14px,2.6vw,22px);
  letter-spacing:2px;
}
.book-title {
  width:fit-content; max-width:100%; margin:16px auto 10px; padding:8px 28px;
  border:1px solid var(--accent2); color:#d66da8; text-align:center;
  font-size:clamp(19px,3vw,27px); background:linear-gradient(90deg,transparent,#26121d,transparent);
}
.controls {
  display:flex; justify-content:center; align-items:center; gap:8px;
  flex-wrap:wrap; margin:14px 0 20px;
}
.controls-label {color:#b390a4;font:10px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}
.lang-btn,.nav-btn {
  border:1px solid var(--line); color:#dcbecf; background:#1b0f16;
  padding:8px 13px; cursor:pointer; transition:.15s;
}
.lang-btn:hover,.lang-btn[aria-pressed="true"],.nav-btn:hover {
  background:#38192a; border-color:#cc6aa1; color:white;
}
.section-title {
  color:#c45d97; text-transform:uppercase; letter-spacing:4px;
  font:12px Arial,sans-serif; margin:0 0 12px; padding-left:5px;
}
.entry {
  display:grid; grid-template-columns:minmax(210px, 34%) 1fr; gap:22px;
  padding:14px; margin:0 0 16px; border:1px solid var(--line);
  background:linear-gradient(115deg,rgba(62,22,44,.55),rgba(17,8,13,.92) 45%);
  position:relative;
}
.entry:before {
  content:""; position:absolute; inset:4px; border:1px solid rgba(164,75,125,.22); pointer-events:none;
}
.art-frame {
  min-height:260px; display:flex; align-items:center; justify-content:center;
  padding:12px; background:radial-gradient(ellipse,#331526,#170b12 72%);
  border:1px solid var(--accent2); outline:1px solid rgba(190,80,142,.25); outline-offset:4px;
  position:relative; z-index:1;
}
.art-frame img {display:block; max-width:100%; max-height:380px; width:auto; height:auto; object-fit:contain; image-rendering:pixelated;}
.info {position:relative; z-index:1; padding:4px 6px 6px 0; min-width:0;}
.monster-index {
  display:inline-block; padding:6px 18px; margin-bottom:10px;
  color:#dd90bc; border:1px solid var(--accent2); background:#27121e;
  font-size:15px;
}
h2 {font-size:clamp(23px,3.3vw,34px); font-weight:normal; margin:0 0 14px; color:#e8d6e0;}
.rule {height:1px; background:linear-gradient(90deg,var(--accent),var(--line-soft),transparent); margin:10px 0 14px;}
dl {display:grid; grid-template-columns:125px 1fr; gap:7px 10px; margin:0; font-size:16px;}
dt {color:#ce69a3;} dd {margin:0;color:#d8c7d1;}
.empty-art {color:#735867;font:11px Arial,sans-serif;letter-spacing:2px;text-align:center;}
.empty {min-height:110px; display:flex; flex-direction:column; justify-content:center;}
footer {text-align:center; color:#876678; font:10px Arial,sans-serif; letter-spacing:3px; padding:14px 0 4px; border-top:1px solid var(--line-soft); margin-top:22px;}
@media(max-width:650px) {
 body {padding:10px 7px 24px} .page {padding:12px 9px}
 .entry {grid-template-columns:1fr; gap:16px; padding:12px}
 .art-frame {min-height:180px; max-height:310px}
 .art-frame img {max-height:280px}
 .info {padding:4px 5px 8px}
 dl {grid-template-columns:105px 1fr; font-size:14px}
}
</style>
</head>
<body>
<main class="page">
  <header class="brand">
    <h1 class="brand-name">Uncanny Kin</h1>
    <p class="brand-sub" data-i18n="archive">Arquivo de Campo · Westfilds</p>
  </header>
  <div class="book-title" data-i18n="bookTitle">Bestiário de Westfilds</div>

  <nav class="controls" aria-label="Language selector">
    <span class="controls-label" data-i18n="language">Idioma</span>
    <button class="lang-btn" type="button" data-lang="pt" aria-pressed="false">PT</button>
    <button class="lang-btn" type="button" data-lang="en" aria-pressed="true">EN</button>
    <button class="lang-btn" type="button" data-lang="es" aria-pressed="false">ES</button>
  </nav>

  <section>
    <h2 class="section-title" data-i18n="hostile">Hostis</h2>
    <div id="entries"></div>
  </section>
  <footer data-i18n="footer">Registros de campo · Westfilds</footer>
</main>

        <div class="art-frame empty"><div class="empty-art">${t.emptyTitle} · ${num}</div></div>
        <div class="info"><span class="monster-index">${t.monster} ${i+1}</span>
          <h2>${t.emptyTitle}</h2><div class="rule"></div><p class="empty-art">${t.emptyInfo}</p>
        </div>
      </article>`;
    const rows = [
      m.type ? [t.type,t[m.type]] : null,
      m.combat ? [t.combat,t[m.combat]] : null,
      m.attack ? [t.attack,t[m.attack]] : null,
      m.location ? [t.location,t[m.location]] : null
    ].filter(Boolean);
    return `
      <article class="entry">
        <div class="art-frame">${m.art ? `<img src="${m.art}" alt="${m.alt}">` : `<div class="empty-art">${t.emptyInfo}</div>`}</div>
        <div class="info">
          <span class="monster-index">${t.monster} ${i+1}</span>
          <h2>${t[m.name]}</h2><div class="rule"></div>
          <dl>${rows.map(([label,value])=>`<dt>${label}:</dt><dd>${value}</dd>`).join("")}</dl>
        </div>
      </article>`;
  }).join("");
}

function setLanguage(lang) {
  const t = translations[lang] || translations.pt;
  document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll("[data-lang]").forEach(btn => btn.setAttribute("aria-pressed",String(btn.dataset.lang===lang)));
  renderEntries(lang);
}
document.querySelectorAll("[data-lang]").forEach(btn => btn.addEventListener("click",()=>setLanguage(btn.dataset.lang)));
setLanguage("en");
</script>
</body>
