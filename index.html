<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestiário — Bellwood</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #080909; color: #deded8;
    font-family: Georgia, "Times New Roman", serif; padding: 36px 16px;
  }
  main { width: min(760px, 100%); margin: 0 auto; }
  header { text-align: center; border-bottom: 1px solid #45413b; padding: 10px 0 22px; margin-bottom: 26px; }
  .eyebrow { color: #9b7667; font: 11px Arial, sans-serif; letter-spacing: 4px; text-transform: uppercase; }
  h1 { margin: 9px 0 5px; color: #e5ded0; font-size: clamp(32px, 7vw, 48px); font-weight: normal; letter-spacing: 3px; }
  .subtitle { margin: 0; color: #8e8b82; font: 12px Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
  .toolbar { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 28px; }
  .toolbar-label { color: #8e8b82; font: 10px Arial, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; margin-right: 4px; }
  .lang-btn { background: #111210; border: 1px solid #45413b; color: #bcb8ad; padding: 8px 12px; cursor: pointer; font: 11px Arial, sans-serif; letter-spacing: 1px; }
  .lang-btn:hover, .lang-btn[aria-pressed="true"] { border-color: #a16d60; color: #f0d8ce; background: #211715; }
  h2 { color: #a65e55; font: 12px Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; margin: 0 0 14px; }
  .entry { border: 1px solid #383633; background: #101110; margin: 0 0 12px; padding: 17px 20px; }
  .entry-top { display: flex; align-items: baseline; gap: 13px; border-bottom: 1px solid #302e2b; padding-bottom: 10px; margin-bottom: 12px; }
  .number { color: #98665b; font: 13px Arial, sans-serif; letter-spacing: 1px; }
  h3 { margin: 0; color: #e4dfd5; font-size: 22px; font-weight: normal; }
  dl { display: grid; grid-template-columns: 105px 1fr; gap: 8px 12px; margin: 0; font: 14px/1.5 Arial, sans-serif; }
  dt { color: #9b7667; text-transform: uppercase; font-size: 10px; letter-spacing: 1.2px; padding-top: 2px; }
  dd { margin: 0; color: #c6c4bc; }
  .empty { min-height: 58px; display: flex; align-items: center; color: #65635d; font: 12px Arial, sans-serif; letter-spacing: 1.5px; }
  footer { border-top: 1px solid #383633; margin-top: 28px; padding-top: 15px; text-align: center; color: #66645e; font: 10px Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
  @media (max-width: 420px) { body { padding: 25px 12px; } .entry { padding: 15px; } dl { grid-template-columns: 86px 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow" data-i18n="eyebrow">Arquivo de campo · Bellwood</div>
    <h1 data-i18n="title">Bestiário</h1>
    <p class="subtitle" data-i18n="subtitle">Registro de criaturas hostis</p>
  </header>

  <nav class="toolbar" aria-label="Language selector">
    <span class="toolbar-label" data-i18n="language">Idioma</span>
    <button class="lang-btn" type="button" data-lang="pt" aria-pressed="true">PT</button>
    <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
    <button class="lang-btn" type="button" data-lang="es" aria-pressed="false">ES</button>
  </nav>

  <section>
    <h2 data-i18n="hostile">Hostis</h2>
    <div id="entries"></div>
  </section>
  <footer data-i18n="footer">Fim dos registros disponíveis</footer>
</main>

<script>
const translations = {
  pt: {
    eyebrow: "Arquivo de campo · Bellwood", title: "Bestiário",
    subtitle: "Registro de criaturas hostis", language: "Idioma",
    hostile: "Hostis", type: "Tipo", combat: "Combate", attack: "Ataque",
    location: "Localização", rare: "Raro", common: "Comum", uncommon: "Incomum",
    twins: "As Gêmeas", tentacles: "Tentáculos", tallYoung: "Jovem Alta",
    twinsCombat: "Fazem perguntas", tentaclesCombat: "Ataca causando dano em área",
    tallYoungAttack: "Ataca com os tentáculos",
    allAreas: "Todas as áreas de Bellwood",
    emptyTitle: "Registro vazio", emptyInfo: "Informações ainda não registradas",
    footer: "Fim dos registros disponíveis"
  },
  en: {
    eyebrow: "Field Archive · Bellwood", title: "Bestiary",
    subtitle: "Hostile Creature Records", language: "Language",
    hostile: "Hostile", type: "Type", combat: "Combat", attack: "Attack",
    location: "Location", rare: "Rare", common: "Common", uncommon: "Uncommon",
    twins: "The Twins", tentacles: "Tentacles", tallYoung: "Tall Young Woman",
    twinsCombat: "Ask questions", tentaclesCombat: "Attacks with area-of-effect damage",
    tallYoungAttack: "Attacks with her tentacles",
    allAreas: "All areas of Bellwood",
    emptyTitle: "Empty Record", emptyInfo: "Information not yet recorded",
    footer: "End of available records"
  },
  es: {
    eyebrow: "Archivo de campo · Bellwood", title: "Bestiario",
    subtitle: "Registro de criaturas hostiles", language: "Idioma",
    hostile: "Hostiles", type: "Tipo", combat: "Combate", attack: "Ataque",
    location: "Ubicación", rare: "Raro", common: "Común", uncommon: "Poco común",
    twins: "Las Gemelas", tentacles: "Tentáculos", tallYoung: "Joven Alta",
    twinsCombat: "Hacen preguntas", tentaclesCombat: "Ataca causando daño en área",
    tallYoungAttack: "Ataca con los tentáculos",
    allAreas: "Todas las áreas de Bellwood",
    emptyTitle: "Registro vacío", emptyInfo: "Información aún no registrada",
    footer: "Fin de los registros disponibles"
  }
};

const monsters = [
  { name: "twins", type: "rare", combat: "twinsCombat", location: "allAreas" },
  { name: "tentacles", type: "common", combat: "tentaclesCombat", location: "allAreas" },
  { name: "tallYoung", type: "uncommon", attack: "tallYoungAttack", location: "allAreas" },
  {}, {}, {}, {}, {}, {}, {}
];

function renderEntries(lang) {
  const t = translations[lang];
  document.getElementById("entries").innerHTML = monsters.map((monster, index) => {
    if (!monster.name) {
      return `<article class="entry"><div class="entry-top"><span class="number">${String(index + 1).padStart(2, "0")}</span><h3>${t.emptyTitle}</h3></div><div class="empty">${t.emptyInfo}</div></article>`;
    }
    const rows = [
      monster.type ? [t.type, t[monster.type]] : null,
      monster.combat ? [t.combat, t[monster.combat]] : null,
      monster.attack ? [t.attack, t[monster.attack]] : null,
      monster.location ? [t.location, t[monster.location]] : null
    ].filter(Boolean);
    return `<article class="entry">
      <div class="entry-top"><span class="number">${String(index + 1).padStart(2, "0")}</span><h3>${t[monster.name]}</h3></div>
      <dl>${rows.map(([label, value]) => `<dt>${label}</dt><dd>${value}</dd>`).join("")}</dl>
    </article>`;
  }).join("");
}

function setLanguage(lang) {
  const t = translations[lang] || translations.pt;
  document.documentElement.lang = lang === "pt" ? "pt-BR" : lang === "en" ? "en" : "es";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t[el.dataset.i18n];
  });
  document.querySelectorAll("[data-lang]").forEach(button => {
    button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
  });
  renderEntries(lang);
}
document.querySelectorAll("[data-lang]").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.lang));
});
setLanguage("pt");
</script>
</body>
</html>
