<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14010b">
<title>Uncanny Kin — Bestiário de Westfilds</title>
<style>
:root {
  --bg:#14010b; --panel:#1f0212; --panel2:#2b0419; --line:#630d3d;
  --line-soft:#420828; --accent:#b82875; --accent2:#7a144c;
  --text:#f0dbe6; --muted:#be9bb0; --gold:#e9a85b;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; padding:24px 16px 40px;
  color:var(--text); background:
    radial-gradient(ellipse at 50% 0%, #4a062c 0%, transparent 42%),
    repeating-linear-gradient(45deg, rgba(138, 20, 87, 0.05) 0 2px, transparent 2px 6px),
    var(--bg);
  font-family:Georgia, "Times New Roman", serif;
}
button { font:inherit; }
.page {
  width:min(1120px,100%); margin:0 auto; position:relative;
  border:1px solid var(--line); padding:18px;
  background:rgba(20, 2, 14, 0.88);
  box-shadow:0 0 0 5px rgba(99, 13, 61, 0.25), 0 0 38px rgba(122, 20, 76, 0.22);
}
.page:before, .page:after {
  content:"👁"; position:absolute; color:#b82875; font-size:22px; top:8px;
}
.page:before {left:12px} .page:after {right:12px}
.brand {text-align:center; padding:4px 10px 18px; border-bottom:1px solid var(--line-soft);}
.brand-name {
  margin:0; font-size:clamp(32px,6vw,58px); line-height:1.05;
  letter-spacing:2px; color:#fce8f3; text-shadow:0 2px #630d3d, 0 0 18px #b82875;
}
.brand-sub {
  margin:8px 0 0; color:#d9a3c3; font-size:clamp(14px,2.6vw,22px);
  letter-spacing:2px;
}
.book-title {
  width:fit-content; max-width:100%; margin:16px auto 10px; padding:8px 28px;
  border:1px solid var(--accent2); color:#d84b93; text-align:center;
  font-size:clamp(19px,3vw,27px); background:linear-gradient(90deg,transparent,#380521,transparent);
}
.controls {
  display:flex; justify-content:center; align-items:center; gap:8px;
  flex-wrap:wrap; margin:14px 0 20px;
}
.controls-label {color:#c493b1;font:10px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}
.lang-btn,.nav-btn {
  border:1px solid var(--line); color:#f0d2e2; background:#240315;
  padding:8px 13px; cursor:pointer; transition:.15s;
}
.lang-btn:hover,.lang-btn[aria-pressed="true"],.nav-btn:hover {
  background:#4d082f; border-color:#d84b93; color:white;
}
.section-title {
  color:#ce3f8a; text-transform:uppercase; letter-spacing:4px;
  font:12px Arial,sans-serif; margin:0 0 12px; padding-left:5px;
}
.entry {
  display:grid; grid-template-columns:minmax(210px, 34%) 1fr; gap:22px;
  padding:14px; margin:0 0 16px; border:1px solid var(--line);
  background:linear-gradient(115deg,rgba(74, 6, 44, 0.6),rgba(20, 2, 14, 0.95) 45%);
  position:relative;
}
.entry:before {
  content:""; position:absolute; inset:4px; border:1px solid rgba(184, 40, 117, 0.25); pointer-events:none;
}
.art-frame {
  min-height:260px; display:flex; align-items:center; justify-content:center;
  padding:12px; background:radial-gradient(ellipse,#420627,#1c0211 72%);
  border:1px solid var(--accent2); outline:1px solid rgba(216, 75, 147, 0.3); outline-offset:4px;
  position:relative; z-index:1;
}
.art-frame img {display:block; max-width:100%; max-height:380px; width:auto; height:auto; object-fit:contain; image-rendering:pixelated;}
.info {position:relative; z-index:1; padding:4px 6px 6px 0; min-width:0;}
.monster-index {
  display:inline-block; padding:6px 18px; margin-bottom:10px;
  color:#ea8ec1; border:1px solid var(--accent2); background:#33041d;
  font-size:15px;
}
h2 {font-size:clamp(23px,3.3vw,34px); font-weight:normal; margin:0 0 14px; color:#f8ecf3;}
.rule {height:1px; background:linear-gradient(90deg,var(--accent),var(--line-soft),transparent); margin:10px 0 14px;}
dl {display:grid; grid-template-columns:125px 1fr; gap:7px 10px; margin:0; font-size:16px;}
dt {color:#d84b93;} dd {margin:0;color:#eae0e6;}
.empty-art {color:#8d5777;font:11px Arial,sans-serif;letter-spacing:2px;text-align:center;}
.empty {min-height:110px; display:flex; flex-direction:column; justify-content:center;}
footer {text-align:center; color:#a1688b; font:10px Arial,sans-serif; letter-spacing:3px; padding:14px 0 4px; border-top:1px solid var(--line-soft); margin-top:22px;}
@media(max-width:650px) {
 body {padding:10px 7px 24px} .page {padding:12px 9px}
 .entry {grid-template-columns:1fr; gap:16px; padding:12px}
 .art-frame {min-height:180px; max-height:310px}
 .art-frame img {max-height:280px}
 .info {padding:4px 5px 8px}
 dl {grid-template-columns:105px 1fr; font-size:14px}
}
</style>
</head>
<body>
<main class="page">
  <header class="brand">
    <h1 class="brand-name">Uncanny Kin</h1>
    <p class="brand-sub" data-i18n="archive">Arquivo de Campo · Westfilds</p>
  </header>
  <div class="book-title" data-i18n="bookTitle">Bestiário de Westfilds</div>

  <nav class="controls" aria-label="Language selector">
    <span class="controls-label" data-i18n="language">Idioma</span>
    <button class="lang-btn" type="button" data-lang="pt" aria-pressed="false">PT</button>
    <button class="lang-btn" type="button" data-lang="en" aria-pressed="true">EN</button>
    <button class="lang-btn" type="button" data-lang="es" aria-pressed="false">ES</button>
  </nav>

  <section>
    <h2 class="section-title" data-i18n="hostile">Hostis</h2>
    <div id="entries"></div>
  </section>
  <footer data-i18n="footer">Registros de campo · Westfilds</footer>
</main>
